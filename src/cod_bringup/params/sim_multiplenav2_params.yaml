controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 999.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "goal_approach_controller::GoalApproachController"
      inner_plugin: "nav2_mppi_controller::MPPIController"
      approach_distance: 2.5
      approach_velocity: 0.2
      time_steps: 80
      model_dt: 0.06
      batch_size: 1500

      vx_std: 0.35
      vy_std: 0.35
      wz_std: 0.2

      vx_max: 2.5
      vy_max: 2.5
      wz_max: 1.5

      vx_min: -2.5
      vy_min: -2.5
      wz_min: -1.5

      ax_max: 1.5
      ay_max: 1.5
      az_max: 3.0

      ax_min: -3.5
      ay_min: -3.5
      az_min: -3.0

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 2.0
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      reset_period: 1.0
      retry_attempt_limit: 2
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathFollowCritic", "PathAlignCritic", "ObstaclesCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 3.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.25
        near_goal_distance: 0.1

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 253.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 3.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 3.0
        offset_from_furthest: 20
        use_path_orientations: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.2
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      plugins: ["static_layer","stvl_voxel_layer","inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.75
      stvl_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        observation_persistence: 0.3
        max_obstacle_height: 2.0
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 3.0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 2.0
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_source
        livox_source:
          data_type: PointCloud2
          topic: livox/lidar_filtered
          transport_type: "raw"
          marking: true
          clearing: true
          obstacle_range: 8.0
          raytrace_range: 9.0
          min_obstacle_height: 0.1
          max_obstacle_height: 1.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 0
          model_type: 1
          vertical_fov_angle: 2.00
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      width: 50
      height: 50
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      use_sim_time: True
      robot_radius: 0.2
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      resolution: 0.04
      track_unknown_space: true
      plugins: ["static_layer","stvl_voxel_layer","inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enable: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.75
      stvl_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        observation_persistence: 0.5
        max_obstacle_height: 2.0
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 3.0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 2.0
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_source
        livox_source:
          data_type: PointCloud2
          topic: livox/lidar_filtered
          transport_type: "raw"
          marking: true
          clearing: true
          obstacle_range: 8.0
          raytrace_range: 9.0
          min_obstacle_height: 0.1
          max_obstacle_height: 1.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 0
          model_type: 1
          vertical_fov_angle: 2.00
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.5
      cost_travel_multiplier: 4.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.05
      retrospective_penalty: 0.025
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 0.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: True
      allow_reverse_expansion: True
      smooth_path: True
      smoother:
        max_iterations: 10000
        w_smooth: 0.4
        w_data: 0.1
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 2.0
    smoother_plugins: ["savitzky_golay_smoother"]
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 7
      poly_order: 3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
        plugin: "nav2_behaviors/Spin"
    backup:
        plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
        plugin: "nav2_behaviors/DriveOnHeading"
    wait:
        plugin: "nav2_behaviors/Wait"
    assisted_teleop:
        plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 2.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    robot_radius: 0.2
    max_radius: 3.5
    service_name: "global_costmap/get_costmap"
    free_threshold: 5
    visualize: True

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 2.5]
    min_velocity: [-2.5, -2.5, -2.5]
    deadband_velocity: [0.05, 0.05, 0.05]
    velocity_timeout: 1.0
    max_accel: [2.5, 2.5, 3.0]
    max_decel: [-3.5, -3.5, -3.0]
    odom_topic: "chassis_odometry_gt"
    odom_duration: 0.1
